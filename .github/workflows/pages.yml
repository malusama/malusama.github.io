name: Build and publish blog
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blog-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned Hugo
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat .hugo-version)
          mkdir -p .tools
          curl --fail --location --retry 3 "https://github.com/gohugoio/hugo/releases/download/v${version}/hugo_${version}_linux-amd64.tar.gz" -o .tools/hugo.tar.gz
          printf '%s  %s\n' '5c3a37a5450b3e386e5b75a87a790fea2d04a796d75e171216c80ef48a32b432' '.tools/hugo.tar.gz' | sha256sum --check
          tar -xzf .tools/hugo.tar.gz -C .tools hugo
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: git diff --exit-code
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
