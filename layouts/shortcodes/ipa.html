{{- $text := .Inner | plainify -}}
{{- $label := .Get "label" | default $text -}}
{{- if .Get "demo" -}}
<button class="ipa ipa-play" lang="{{ .Get "lang" | default "und" }}" translate="no" type="button" data-audio="/audio/hainan-toponymy/{{ .Get "demo" }}.wav" aria-label="播放 {{ $label }} 的近似合成示范" aria-pressed="false" title="点击音标试听 {{ $label }}：近似合成示范，非母语录音">{{ $text }}</button>
{{- else -}}
<span class="ipa" lang="{{ .Get "lang" | default "und" }}" translate="no">{{ $text }}</span>
{{- end -}}
